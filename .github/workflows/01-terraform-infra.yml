name: "01: Terraform Infrastructure Pipeline"

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/01-terraform-infra.yml"
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/01-terraform-infra.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to execute (apply / plan / destroy)"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - plan
          - destroy

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: "ap-south-1"
  TF_VERSION: "1.9.5"
  STATE_BUCKET: "complete-eks-devsecops-tfstate-461195385728"
  LOCK_TABLE: "complete-eks-devsecops-tflocks"
  CLUSTER_NAME: "complete-eks-platform"

jobs:
  # ============================================================================
  # Step 1: Pre-Flight Backend Bootstrap (Auto-provision S3 & DynamoDB if missing)
  # ============================================================================
  bootstrap-backend:
    name: "Pre-Flight: Bootstrap S3 Backend & Lock Table"
    runs-on: ubuntu-latest
    if: github.event.inputs.action != 'destroy'
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure S3 State Bucket Exists
        run: |
          if ! aws s3api head-bucket --bucket "${{ env.STATE_BUCKET }}" 2>/dev/null; then
            echo "Creating S3 bucket: ${{ env.STATE_BUCKET }}"
            aws s3api create-bucket \
              --bucket "${{ env.STATE_BUCKET }}" \
              --region "${{ env.AWS_REGION }}" \
              --create-bucket-configuration LocationConstraint="${{ env.AWS_REGION }}"
            aws s3api put-bucket-versioning \
              --bucket "${{ env.STATE_BUCKET }}" \
              --versioning-configuration Status=Enabled
          else
            echo "S3 state bucket already exists: ${{ env.STATE_BUCKET }}"
          fi

      - name: Ensure DynamoDB Lock Table Exists
        run: |
          if ! aws dynamodb describe-table --table-name "${{ env.LOCK_TABLE }}" --region "${{ env.AWS_REGION }}" 2>/dev/null; then
            echo "Creating DynamoDB lock table: ${{ env.LOCK_TABLE }}"
            aws dynamodb create-table \
              --table-name "${{ env.LOCK_TABLE }}" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region "${{ env.AWS_REGION }}"
            aws dynamodb wait table-exists --table-name "${{ env.LOCK_TABLE }}" --region "${{ env.AWS_REGION }}"
          else
            echo "DynamoDB lock table already exists: ${{ env.LOCK_TABLE }}"
          fi

  # ============================================================================
  # Step 2: Terraform Plan & Apply Pipeline
  # ============================================================================
  terraform-apply:
    name: "Terraform Lint, Plan & Apply"
    needs: bootstrap-backend
    if: github.event.inputs.action != 'destroy'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform Engine
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Check Terraform Formatting
        run: terraform fmt -check -recursive

      - name: Run tfsec Security Scanner
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform
          soft_fail: true

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event.inputs.action == 'apply' || github.event.inputs.action == '')
        run: terraform apply -auto-approve tfplan

  # ============================================================================
  # Step 3: One-Go Total Wipeout Destroy Pipeline
  # ============================================================================
  terraform-destroy:
    name: "One-Go Total Wipeout Destroy"
    if: github.event.inputs.action == 'destroy'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform Engine
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Pre-Clean Kubernetes Ingress & AWS ALB
        run: |
          echo "Checking if EKS cluster exists to delete AWS ALBs..."
          if aws eks describe-cluster --name "${{ env.CLUSTER_NAME }}" --region "${{ env.AWS_REGION }}" >/dev/null 2>&1; then
            echo "EKS cluster is active. Configuring kubectl to clean up ingress..."
            aws eks update-kubeconfig --name "${{ env.CLUSTER_NAME }}" --region "${{ env.AWS_REGION }}"
            kubectl delete ingress --all --all-namespaces --timeout=2m || true
            kubectl delete svc --all --all-namespaces --field-selector spec.type=LoadBalancer --timeout=2m || true
            echo "Waiting 30 seconds for AWS Load Balancer Controller to deprovision ALBs..."
            sleep 30
          else
            echo "EKS cluster not active, skipping ingress cleanup."
          fi

      - name: Terraform Init
        run: terraform init

      - name: Terraform Destroy
        run: terraform destroy -auto-approve

      - name: Total Wipeout of State S3 Bucket & Lock Table
        run: |
          echo "🧹 Cleaning up S3 state bucket: ${{ env.STATE_BUCKET }}"
          aws s3 rm "s3://${{ env.STATE_BUCKET }}" --recursive || true
          aws s3api delete-bucket --bucket "${{ env.STATE_BUCKET }}" --region "${{ env.AWS_REGION }}" || true

          echo "🧹 Cleaning up DynamoDB lock table: ${{ env.LOCK_TABLE }}"
          aws dynamodb delete-table --table-name "${{ env.LOCK_TABLE }}" --region "${{ env.AWS_REGION }}" || true
          echo "✅ [SUCCESS] 100% Total Wipeout Completed! Zero resources left on AWS."
